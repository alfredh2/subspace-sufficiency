[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subspace-sufficiency"
version = "0.1.0"
description = "Auditing what a fitted minimal viable subspace (MVS) licenses in Qwen3-8B: sufficiency vs necessity vs transplantability"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "numpy", "pandas", "matplotlib", "pyyaml", "datasets"]

[project.optional-dependencies]
dev = ["pytest"]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA", "model: needs a downloaded HF model"]
